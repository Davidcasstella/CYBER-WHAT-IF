<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Auditoría automatizada de ciberseguridad sobre una réplica simulada de tu empresa." />
    <meta name="theme-color" content="#15233f" />
    <title>CyberWhat-If</title>
    <script>
      // Aplica el tema antes del primer pintado para evitar el destello claro/oscuro.
      try {
        var t = localStorage.getItem('cyberwhatif.theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
