# Entorno de desarrollo local. Uso: `docker compose up -d db` (solo base de datos)
# o `docker compose up --build` (base de datos + API).
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cyberwhatif
      MYSQL_USER: cyberwhatif
      MYSQL_PASSWORD: cyberwhatif
      MYSQL_ROOT_PASSWORD: root-solo-desarrollo
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucyberwhatif", "-pcyberwhatif"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://cyberwhatif:cyberwhatif@db:3306/cyberwhatif
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
